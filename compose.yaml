services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navigator}
      POSTGRES_USER: ${POSTGRES_USER:-navigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigator}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: .
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://polza.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-flash}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      CORPUS_PATH: /app/data/demo_sources.json
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://navigator:navigator@postgres:5432/navigator?sslmode=disable}
      AUTH_MODE: ${AUTH_MODE:-demo}
      DEMO_PROFILE: ${DEMO_PROFILE:-intern}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://demo-jira.local}
      AI_MODE: ${AI_MODE:-replay}
      AI_BASE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-310s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JOB_LEASE: ${JOB_LEASE:-60s}
      JOB_HEARTBEAT: ${JOB_HEARTBEAT:-15s}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-2}
      SEED_PATH: /app/data/demo_tasks.json
      CORPUS_PATH: /app/data/demo_sources.json
      REPLAY_DIR: /app/examples/recorded
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:ro
      - ./examples/recorded:/app/examples/recorded:ro
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
